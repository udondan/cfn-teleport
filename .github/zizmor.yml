# First-party actions keep their version tags, everything else is pinned to a commit SHA.
# The reusable workflow of wait-for-turn is used by its major tag, so every
# release reaches this repo without update PRs.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        "udondan/wait-for-turn/*": ref-pin
        "*": hash-pin
