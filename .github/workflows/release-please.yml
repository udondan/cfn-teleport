---
name: release-please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.OVERRIDE_TOKEN }}

  # release-please creates the GitHub release as a draft (see
  # release-please-config.json). Releases in this repository are immutable
  # once published, so the binaries have to be attached while the release is
  # still a draft. Draft releases never trigger `release` events, therefore
  # the publish workflow is called from here instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      ref: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
